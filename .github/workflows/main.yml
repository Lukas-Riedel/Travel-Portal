on: push
name: Deploy web
jobs:
  web-deploy:
    name: Deploy Web
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4    
    - name: Upload files
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: 254146.w46.wedos.net
        username: w254146
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./Web/
        server-dir: www/domains/lriedel.cz/
  maven-verify:
    name: Verify Photo Uploader
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4    
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Run verification
        run: mvn verify -f PhotoUploader/pom.xml