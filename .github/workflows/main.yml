name: Main Pipeline
on:
  push:
    branches:
    - main
    - highlights-selecting-tmp
jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.filter.outputs.core }}
      cortex: ${{ steps.filter.outputs.cortex }}
      iam: ${{ steps.filter.outputs.iam }}
      portal: ${{ steps.filter.outputs.portal }}
      agent: ${{ steps.filter.outputs.agent }}
      bridgex: ${{ steps.filter.outputs.bridgex }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4    
    - name: Filter Paths
      uses: dorny/paths-filter@v3
      id: filter
      with:
        filters: |
          core:
            - 'Core/**'
            - 'Common/**'
            - 'Helm/Core/**'
            - 'Helm/Common/**'
          cortex:
            - 'Cortex/**'
            - 'Helm/Cortex/**'
            - 'Helm/Common/**'
          iam:
            - 'Iam/**'
            - 'Common/**'
            - 'Helm/Iam/**'
            - 'Helm/Common/**'
          portal:
            - 'Portal/**'
            - 'Helm/Portal/**'
            - 'Helm/Common/**'
          agent:
            - 'Agent/**'
          bridgex:
            - 'BridgeX/**'
  deploy-iam:
    name: Deploy IAM
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.iam == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set Lowercase Owner Name
      id: owner-lowercasing
      run: echo "owner=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
    - name: Login to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Build IAM Image
      run: |
        docker build \
          -t ghcr.io/${{ steps.owner-lowercasing.outputs.owner }}/iam:${{ github.run_number }} \
          -t ghcr.io/${{ steps.owner-lowercasing.outputs.owner }}/iam:latest \
          -f Iam/Dockerfile .
    - name: Push IAM Image
      run: |
        docker push ghcr.io/${{ steps.owner-lowercasing.outputs.owner }}/iam:${{ github.run_number }}
        docker push ghcr.io/${{ steps.owner-lowercasing.outputs.owner }}/iam:latest
    - name: Set Up Kubectl
      uses: azure/setup-kubectl@v3
    - name: Open SSH Tunnel
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -H ${{ vars.SSH_HOSTNAME }} >> ~/.ssh/known_hosts
        ssh -L 6443:localhost:6443 ${{ vars.SSH_USER }}@${{ vars.SSH_HOSTNAME }} -N -f
    - name: Set Up Helm
      uses: azure/setup-helm@v3
    - name: Deploy IAM with Helm
      run: |
        echo "${{ secrets.KUBECONFIG }}" | base64 -d > kubeconfig
        export KUBECONFIG=$PWD/kubeconfig
        helm upgrade iam ./Helm/Iam \
          -f ./Helm/Iam/values.yaml \
          --set iam.tag=${{ github.run_number }} \
          --install \
          --wait \
          --timeout 5m \
          --atomic
  deploy-core:
    name: Deploy Core
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.core == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set Lowercase Owner Name
      id: owner-lowercasing
      run: echo "owner=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
    - name: Login to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Build Core Image
      run: |
        docker build \
          -t ghcr.io/${{ steps.owner-lowercasing.outputs.owner }}/core:${{ github.run_number }} \
          -t ghcr.io/${{ steps.owner-lowercasing.outputs.owner }}/core:latest \
          -f Core/Dockerfile .
    - name: Push Core Image
      run: |
        docker push ghcr.io/${{ steps.owner-lowercasing.outputs.owner }}/core:${{ github.run_number }}
        docker push ghcr.io/${{ steps.owner-lowercasing.outputs.owner }}/core:latest
    - name: Set Up Kubectl
      uses: azure/setup-kubectl@v3
    - name: Open SSH Tunnel
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -H ${{ vars.SSH_HOSTNAME }} >> ~/.ssh/known_hosts
        ssh -L 6443:localhost:6443 ${{ vars.SSH_USER }}@${{ vars.SSH_HOSTNAME }} -N -f
    - name: Set Up Helm
      uses: azure/setup-helm@v3
    - name: Deploy Core with Helm
      run: |
        echo "${{ secrets.KUBECONFIG }}" | base64 -d > kubeconfig
        export KUBECONFIG=$PWD/kubeconfig
        helm upgrade core ./Helm/Core \
          -f ./Helm/Core/values.yaml \
          --set core.tag=${{ github.run_number }} \
          --install \
          --wait \
          --timeout 5m \
          --atomic
  deploy-cortex:
    name: Deploy Cortex
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.cortex == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set Lowercase Owner Name
      id: owner-lowercasing
      run: echo "owner=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
    - name: Login to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Build Cortex Image
      run: |
        docker build \
          -t ghcr.io/${{ steps.owner-lowercasing.outputs.owner }}/cortex:${{ github.run_number }} \
          -t ghcr.io/${{ steps.owner-lowercasing.outputs.owner }}/cortex:latest \
          -f Cortex/Dockerfile .
    - name: Push Cortex Image
      run: |
        docker push ghcr.io/${{ steps.owner-lowercasing.outputs.owner }}/cortex:${{ github.run_number }}
        docker push ghcr.io/${{ steps.owner-lowercasing.outputs.owner }}/cortex:latest
    - name: Set Up Kubectl
      uses: azure/setup-kubectl@v3
    - name: Open SSH Tunnel
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -H ${{ vars.SSH_HOSTNAME }} >> ~/.ssh/known_hosts
        ssh -L 6443:localhost:6443 ${{ vars.SSH_USER }}@${{ vars.SSH_HOSTNAME }} -N -f
    - name: Set Up Helm
      uses: azure/setup-helm@v3
    - name: Deploy Cortex with Helm
      run: |
        echo "${{ secrets.KUBECONFIG }}" | base64 -d > kubeconfig
        export KUBECONFIG=$PWD/kubeconfig
        helm upgrade cortex ./Helm/Cortex \
          -f ./Helm/Cortex/values.yaml \
          --set cortex.tag=${{ github.run_number }} \
          --install \
          --wait \
          --timeout 5m \
          --atomic
  deploy-portal:
    name: Deploy Portal
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.portal == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set Lowercase Owner Name
      id: owner-lowercasing
      run: echo "owner=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
    - name: Login to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Set Up Node.js
      uses: actions/setup-node@v3
      with:
          node-version: '18'
    - name: Install NPM Dependencies
      run: |
        cd Portal
        npm install --legacy-peer-deps
    - name: Generate Core Swagger types
      env:
        CORE_BASE_URL: ${{ vars.CORE_BASE_URL }}
      run: |
        cd Portal
        node swagger.config.js
    - name: Build Portal Image
      run: |
        docker build \
          -t ghcr.io/${{ steps.owner-lowercasing.outputs.owner }}/portal:${{ github.run_number }} \
          -t ghcr.io/${{ steps.owner-lowercasing.outputs.owner }}/portal:latest \
          -f Portal/Dockerfile .
    - name: Push Portal Image
      run: |
        docker push ghcr.io/${{ steps.owner-lowercasing.outputs.owner }}/portal:${{ github.run_number }}
        docker push ghcr.io/${{ steps.owner-lowercasing.outputs.owner }}/portal:latest
    - name: Set Up Kubectl
      uses: azure/setup-kubectl@v3
    - name: Open SSH Tunnel
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -H ${{ vars.SSH_HOSTNAME }} >> ~/.ssh/known_hosts
        ssh -L 6443:localhost:6443 ${{ vars.SSH_USER }}@${{ vars.SSH_HOSTNAME }} -N -f
    - name: Set Up Helm
      uses: azure/setup-helm@v3
    - name: Deploy Portal with Helm
      run: |
        echo "${{ secrets.KUBECONFIG }}" | base64 -d > kubeconfig
        export KUBECONFIG=$PWD/kubeconfig
        helm upgrade portal ./Helm/Portal \
          -f ./Helm/Portal/values.yaml \
          --set portal.tag=${{ github.run_number }} \
          --set portal.fcm.key.api=${{ secrets.FIREBASE_API_KEY }} \
          --set portal.fcm.key.vapid=${{ secrets.FIREBASE_VAPID_KEY }} \
          --set portal.google.maps.key.api=${{ secrets.FRONTEND_GOOGLE_MAPS_API_KEY }} \
          --install \
          --wait \
          --timeout 5m \
          --atomic
  verify-agent:
    name: Verify Agent
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.agent == 'true' }}
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
    - name: Verify
      run: mvn verify -f Agent/pom.xml -Dservice.core.url=${{ vars.CORE_BASE_URL }}
  release-bridgex:
    name: Release BridgeX
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.bridgex == 'true' }}
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set Up JDK
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
    - name: Set Up Android SDK
      uses: android-actions/setup-android@v2
    - name: Grant Execute Permission for Gradlew
      run: |
        cd BridgeX
        chmod +x ./gradlew
    - name: Prepare Keystore
      run: |
        cd BridgeX
        cd app
        echo "${{ secrets.BRIDGEX_KEYSTORE_BASE64 }}" | base64 --decode > bridgex.jks
    - name: Build APK
      run: |
        cd BridgeX
        ./gradlew assembleRelease
      env:
        VERSION_TAG: ${{ github.run_number }}
        KEYSTORE_FILE: bridgex.jks
        KEYSTORE_PASSWORD: ${{ secrets.BRIDGEX_KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.BRIDGEX_KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.BRIDGEX_KEY_PASSWORD }}
        PORTAL_BASE_URL: ${{ vars.PORTAL_BASE_URL }}
        CORE_BASE_URL: ${{ vars.CORE_BASE_URL }}
        IAM_BASE_URL: ${{ vars.IAM_BASE_URL }}
        IAM_APP_CLIENT_ID: ${{ vars.IAM_APP_CLIENT_ID }}
        FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
        FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_AUTH_DOMAIN }}
        FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
        FIREBASE_STORAGE_BUCKET: ${{ vars.FIREBASE_STORAGE_BUCKET }}
        FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
        FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
        FIREBASE_MEASUREMENT_ID: ${{ vars.FIREBASE_MEASUREMENT_ID }}
        FIREBASE_VAPID_KEY: ${{ secrets.FIREBASE_VAPID_KEY }}
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: bridgex-apk
        path: BridgeX/app/build/outputs/apk/release/app-release.apk
    - name: Upload to Firebase App Distribution
      uses: w9jds/firebase-action@master
      with:
        args: appdistribution:distribute BridgeX/app/build/outputs/apk/release/app-release.apk --app ${{ vars.FIREBASE_ANDROID_APP_ID }} --groups Users
      env:
        GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}