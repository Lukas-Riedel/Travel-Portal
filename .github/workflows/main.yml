name: Main Pipeline
on: push
jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.filter.outputs.core }}
      iam: ${{ steps.filter.outputs.iam }}
      portal: ${{ steps.filter.outputs.portal }}
      agent: ${{ steps.filter.outputs.agent }}
      bridgex: ${{ steps.filter.outputs.bridgex }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4    
      - name: Filter Paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            core:
              - 'Core/**'
              - 'Common/**'
            iam:
              - 'Iam/**'
              - 'Common/**'
            portal:
              - 'Portal/**'
            agent:
              - 'Agent/**'
            bridgex:
              - 'BridgeX/**'
  deploy-iam:
    name: Deploy IAM
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.iam == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set Lowercase Owner Name
      id: owner_formatting
      run: echo "owner=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
    - name: Login to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Build IAM Image
      run: |
        docker build -t ghcr.io/${{ steps.owner_formatting.outputs.owner }}/iam:${{ github.run_number }} -f Iam/Dockerfile .
    - name: Push IAM Image
      run: |
        docker push ghcr.io/${{ steps.owner_formatting.outputs.owner }}/iam:${{ github.run_number }}
    - name: Set Up Kubectl
      uses: azure/setup-kubectl@v3
    - name: Set Up Helm
      uses: azure/setup-helm@v3
    - name: Deploy IAM with Helm
      run: |
        echo "${{ secrets.KUBECONFIG }}" > kubeconfig
        export KUBECONFIG=$PWD/kubeconfig
        helm upgrade iam ./Helm/Iam \
          -f ./Helm/Iam/values.yaml \
          --set iam.tag=${{ github.run_number }} \
          --install
  deploy-core:
    name: Deploy Core
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.core == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set Lowercase Owner Name
      id: owner_formatting
      run: echo "owner=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
    - name: Login to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Build Core Image
      run: |
        docker build -t ghcr.io/${{ steps.owner_formatting.outputs.owner }}/core:${{ github.run_number }} -f Core/Dockerfile .
    - name: Push Core Image
      run: |
        docker push ghcr.io/${{ steps.owner_formatting.outputs.owner }}/core:${{ github.run_number }}
    - name: Set Up Kubectl
      uses: azure/setup-kubectl@v3
    - name: Set Up Helm
      uses: azure/setup-helm@v3
    - name: Deploy Core with Helm
      run: |
        echo "${{ secrets.KUBECONFIG }}" > kubeconfig
        export KUBECONFIG=$PWD/kubeconfig
        helm upgrade core ./Helm/Core \
          -f ./Helm/Core/values.yaml \
          --set core.tag=${{ github.run_number }} \
          --install
  deploy-core-and-portal:
    name: Deploy Core and Portal
    needs: detect-changes
    if: false
    # if: ${{ needs.detect-changes.outputs.core == 'true' || needs.detect-changes.outputs.portal == 'true' }}
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4    
    - name: Set Up PHP and Composer
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mbstring, mysqli
        coverage: none
    - name: Set Up Node.js
      uses: actions/setup-node@v3
      with:
          node-version: '18'
    - name: Install Core Composer Dependencies
      run: |
        cd Core
        composer install --no-dev --optimize-autoloader
    - name: Install NPM Dependencies
      run: |
        cd Portal
        npm install --legacy-peer-deps
    - name: Generate Core Swagger types
      run: |
        cd Portal
        node swagger.config.js
      env:
        VITE_CORE_BASE_URL: ${{ vars.CORE_BASE_URL }}
    - name: Build React Project
      run: |
        cd Portal
        npm run build
      env:
        VITE_SW_VERSION: ${{ github.run_number }}
        VITE_PORTAL_BASE_URL: ${{ vars.PORTAL_BASE_URL }}
        VITE_CORE_BASE_URL: ${{ vars.CORE_BASE_URL }}
        VITE_IAM_BASE_URL: ${{ vars.IAM_BASE_URL }}
        VITE_IAM_APP_CLIENT_ID: ${{ vars.IAM_APP_CLIENT_ID }}
        VITE_FRONTEND_GOOGLE_MAPS_API_KEY: ${{ secrets.FRONTEND_GOOGLE_MAPS_API_KEY }}
        VITE_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
        VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_AUTH_DOMAIN }}
        VITE_FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
        VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.FIREBASE_STORAGE_BUCKET }}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
        VITE_FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
        VITE_FIREBASE_MEASUREMENT_ID: ${{ vars.FIREBASE_MEASUREMENT_ID }}
        VITE_FIREBASE_VAPID_KEY: ${{ secrets.FIREBASE_VAPID_KEY }}
    - name: Prepare Files
      run: |
        mkdir target
        mkdir target/api
        shopt -s dotglob
        cp -r ./Core/* target/api/
        rm -rf target/api/public
        cp -r ./Core/public/* target/api/
        cp -r ./Portal/dist/* target/
    - name: Generate secrets.php
      run: |
        cat > generate_secrets.php <<'PHP'
        <?php
        $keys = [
          "MAX_WORKERS_COUNT","DB_NAME","DB_USER","DB_PASSWORD","DB_HOST",
          "ENCRYPTION_PRIVATE_KEY","CORE_BASE_URL","IAM_BASE_URL","INTERNAL_IAM_BASE_URL",
          "INTERNAL_ADMIN_IAM_BASE_URL","IAM_APP_CLIENT_ID","IAM_BACKEND_CLIENT_ID",
          "IAM_BACKEND_CLIENT_SECRET", "IAM_AGENT_CLIENT_ID", "IBM_CLOUD_API_KEY", "IBM_DATAPLATFORM_BASE_URL",
          "GOOGLE_API_CLIENT_ID","GOOGLE_API_CLIENT_SECRET","GOOGLE_GEMINI_API_KEY",
          "EXCHANGE_RATE_API_KEY","GRAFANA_LOKI_ENTRYPOINT","GRAFANA_LOKI_CLIENT_NAME",
          "GRAFANA_LOKI_USER","GRAFANA_LOKI_PASSWORD","RMQ_HOST","RMQ_PORT","RMQ_USER",
          "RMQ_PASSWORD","RMQ_VHOST","WORKER_QUEUE_NAME","REDIS_HOST","REDIS_PORT",
          "REDIS_PASSWORD","ALLOWED_REQUEST_ORIGINS","FCM_PROJECT_ID","FCM_PRIVATE_KEY_ID",
          "FCM_CLIENT_X509_CERTIFICATE_URL","FCM_PRIVATE_KEY","FCM_CLIENT_EMAIL",
          "FCM_CLIENT_ID","JWKS_PUBLIC_KEY","BACKEND_GOOGLE_MAPS_API_KEY"
        ];

        $header = <<<'HEADER'
        <?php
        namespace Secrets;

        function getenv(string $key) : array|string|false {
          if (\defined($key)) {
            return \constant($key);
          }
          return \getenv($key);
        }
        HEADER;

        $out = $header . "\n";
        foreach ($keys as $k) {
          $out .= "define(\"" . $k . "\", \"" . getenv($k) . "\");\n";
        }

        $out .= "?>\n";
        file_put_contents("target/secrets.php", $out);
        PHP

        php generate_secrets.php
        rm -f generate_secrets.php
      env:
        MAX_WORKERS_COUNT: ${{ vars.MAX_WORKERS_COUNT }}
        DB_NAME: ${{ vars.DB_NAME }}
        DB_USER: ${{ vars.DB_USER }}
        DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        DB_HOST: ${{ vars.DB_HOST }}
        ENCRYPTION_PRIVATE_KEY: ${{ secrets.ENCRYPTION_PRIVATE_KEY }}
        CORE_BASE_URL: ${{ vars.CORE_BASE_URL }}
        IAM_BASE_URL: ${{ vars.IAM_BASE_URL }}
        INTERNAL_IAM_BASE_URL: ${{ vars.INTERNAL_IAM_BASE_URL }}
        INTERNAL_ADMIN_IAM_BASE_URL: ${{ vars.INTERNAL_ADMIN_IAM_BASE_URL }}
        IAM_APP_CLIENT_ID: ${{ vars.IAM_APP_CLIENT_ID }}
        IAM_BACKEND_CLIENT_ID: ${{ vars.IAM_BACKEND_CLIENT_ID }}
        IAM_BACKEND_CLIENT_SECRET: ${{ secrets.IAM_BACKEND_CLIENT_SECRET }}
        IAM_AGENT_CLIENT_ID: ${{ vars.IAM_AGENT_CLIENT_ID }}
        BACKEND_GOOGLE_MAPS_API_KEY: ${{ secrets.BACKEND_GOOGLE_MAPS_API_KEY }}
        IBM_DATAPLATFORM_BASE_URL: ${{ vars.IBM_DATAPLATFORM_BASE_URL }}
        IBM_CLOUD_API_KEY: ${{ secrets.IBM_CLOUD_API_KEY }}
        GOOGLE_API_CLIENT_ID: ${{ vars.GOOGLE_API_CLIENT_ID }}
        GOOGLE_API_CLIENT_SECRET: ${{ secrets.GOOGLE_API_CLIENT_SECRET }}
        GOOGLE_GEMINI_API_KEY: ${{ secrets.GOOGLE_GEMINI_API_KEY }}
        EXCHANGE_RATE_API_KEY: ${{ secrets.EXCHANGE_RATE_API_KEY }}
        GRAFANA_LOKI_ENTRYPOINT: ${{ vars.GRAFANA_LOKI_ENTRYPOINT }}
        GRAFANA_LOKI_CLIENT_NAME: ${{ vars.GRAFANA_LOKI_CLIENT_NAME }}
        GRAFANA_LOKI_USER: ${{ vars.GRAFANA_LOKI_USER }}
        GRAFANA_LOKI_PASSWORD: ${{ secrets.GRAFANA_LOKI_PASSWORD }}
        RMQ_HOST: ${{ vars.RMQ_HOST }}
        RMQ_PORT: ${{ vars.RMQ_PORT }}
        RMQ_USER: ${{ vars.RMQ_USER }}
        RMQ_PASSWORD: ${{ secrets.RMQ_PASSWORD }}
        RMQ_VHOST: ${{ vars.RMQ_VHOST }}
        WORKER_QUEUE_NAME: ${{ vars.WORKER_QUEUE_NAME }}
        REDIS_HOST: ${{ vars.REDIS_HOST }}
        REDIS_PORT: ${{ vars.REDIS_PORT }}
        REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
        ALLOWED_REQUEST_ORIGINS: ${{ vars.ALLOWED_REQUEST_ORIGINS }}
        FCM_PROJECT_ID: ${{ vars.FCM_PROJECT_ID }}
        FCM_PRIVATE_KEY_ID: ${{ secrets.FCM_PRIVATE_KEY_ID }}
        FCM_CLIENT_X509_CERTIFICATE_URL: ${{ vars.FCM_CLIENT_X509_CERTIFICATE_URL }}
        FCM_PRIVATE_KEY: ${{ secrets.FCM_PRIVATE_KEY }}
        FCM_CLIENT_EMAIL: ${{ vars.FCM_CLIENT_EMAIL }}
        FCM_CLIENT_ID: ${{ vars.FCM_CLIENT_ID }}
        JWKS_PUBLIC_KEY: ${{ vars.JWKS_PUBLIC_KEY }}
    - name: Upload Files
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ vars.FTP_SERVER }}
        username: ${{ vars.FTP_USER }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: target/
        server-dir: ${{ vars.FTP_DIRECTORY }}
    - name: Deploy
      uses: muhfaris/request-action@v0.1.2
      with:
        method: GET
        url: ${{ vars.CORE_BASE_URL }}/deploy.php
  verify-agent:
    name: Verify Agent
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.agent == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4    
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Verify
        run: mvn verify -f Agent/pom.xml
  deploy-bridgex:
    name: Deploy BridgeX
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.bridgex == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set Up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Set Up Android SDK
        uses: android-actions/setup-android@v2
      - name: Grant Execute Permission for Gradlew
        run: |
          cd BridgeX
          chmod +x ./gradlew
      - name: Prepare keystore
        run: |
          cd BridgeX
          cd app
          echo "${{ secrets.BRIDGEX_KEYSTORE_BASE64 }}" | base64 --decode > bridgex.jks
      - name: Build APK
        run: |
          cd BridgeX
          ./gradlew assembleRelease
        env:
          VERSION_TAG: ${{ github.run_number }}
          KEYSTORE_FILE: bridgex.jks
          KEYSTORE_PASSWORD: ${{ secrets.BRIDGEX_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BRIDGEX_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.BRIDGEX_KEY_PASSWORD }}
          PORTAL_BASE_URL: ${{ vars.PORTAL_BASE_URL }}
          CORE_BASE_URL: ${{ vars.CORE_BASE_URL }}
          IAM_BASE_URL: ${{ vars.IAM_BASE_URL }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ vars.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
          FIREBASE_MEASUREMENT_ID: ${{ vars.FIREBASE_MEASUREMENT_ID }}
          FIREBASE_VAPID_KEY: ${{ secrets.FIREBASE_VAPID_KEY }}
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bridgex-apk
          path: BridgeX/app/build/outputs/apk/release/app-release.apk