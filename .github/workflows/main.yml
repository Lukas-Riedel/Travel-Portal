on: push
name: Main Pipeline
jobs:
  web-deploy:
    name: Deploy Web
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4    
    - name: Prepare Files
      run: |
        mkdir target
        mkdir target/api
        shopt -s dotglob
        cp -r ./Portal/* target/
        cp -r ./Service/* target/api/
    - name: Upload Files
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: 254146.w46.wedos.net
        username: w254146
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: target/
        server-dir: www/domains/lriedel.cz/
    - name: Deploy
      uses: muhfaris/request-action@v0.1.2
      with:
        method: GET
        url: https://lriedel.cz/api/php/deploy.php
  maven-verify:
    name: Build Agent
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4    
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Verify
        run: mvn verify -f Agent/pom.xml