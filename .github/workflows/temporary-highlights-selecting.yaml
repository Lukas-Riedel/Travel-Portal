name: Main Pipeline
on:
  push:
    branches:
    - highlights-selecting-job-tmp
jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.filter.outputs.core }}
      cortex: ${{ steps.filter.outputs.cortex }}
      iam: ${{ steps.filter.outputs.iam }}
      portal: ${{ steps.filter.outputs.portal }}
      agent: ${{ steps.filter.outputs.agent }}
      bridgex: ${{ steps.filter.outputs.bridgex }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4    
    - name: Filter Paths
      uses: dorny/paths-filter@v3
      id: filter
      with:
        filters: |
          core:
            - 'Core/**'
            - 'Common/**'
            - 'Helm/Core/**'
            - 'Helm/Common/**'
  deploy-core:
    name: Deploy Core
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.core == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set Lowercase Owner Name
      id: owner-lowercasing
      run: echo "owner=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
    - name: Login to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Build Core Image
      run: |
        docker build \
          -t ghcr.io/${{ steps.owner-lowercasing.outputs.owner }}/core:${{ github.run_number }} \
          -f Core/Dockerfile .
    - name: Push Core Image
      run: |
        docker push ghcr.io/${{ steps.owner-lowercasing.outputs.owner }}/core:${{ github.run_number }}
    - name: Set Up Kubectl
      uses: azure/setup-kubectl@v3
    - name: Open SSH Tunnel
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -H ${{ vars.SSH_HOSTNAME }} >> ~/.ssh/known_hosts
        ssh -L 6443:localhost:6443 ${{ vars.SSH_USER }}@${{ vars.SSH_HOSTNAME }} -N -f
    - name: Set Up Helm
      uses: azure/setup-helm@v3
    - name: Deploy Core with Helm
      run: |
        echo "${{ secrets.KUBECONFIG }}" | base64 -d > kubeconfig
        export KUBECONFIG=$PWD/kubeconfig
        helm upgrade core-highlights ./Helm/Core \
          -f ./Helm/Core/values.yaml \
          --set core.tag=${{ github.run_number }} \
          --install \
          --wait \
          --timeout 10m \
          --atomic