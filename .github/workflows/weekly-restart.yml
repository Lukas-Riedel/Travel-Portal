name: Weekly Deployment Restart
on:
  schedule:
    - cron: '0 3 * * 5'
  workflow_dispatch:
jobs:
  restart:
    name: Restart Deployment
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set Up Kubectl
        uses: azure/setup-kubectl@v3
      - name: Rollout Core Restart
        run: |
          echo "${{ secrets.KUBECONFIG }}" > kubeconfig
          export KUBECONFIG=$PWD/kubeconfig
          kubectl rollout restart deployment core
          kubectl rollout restart deployment core-worker
      - name: Rollout IAM Restart
        run: |
          echo "${{ secrets.KUBECONFIG }}" > kubeconfig
          export KUBECONFIG=$PWD/kubeconfig
          kubectl rollout restart deployment iam
      - name: Rollout Portal Restart
        run: |
          echo "${{ secrets.KUBECONFIG }}" > kubeconfig
          export KUBECONFIG=$PWD/kubeconfig
          kubectl rollout restart deployment portal
      - name: Rollout Cortex Restart
        run: |
          echo "${{ secrets.KUBECONFIG }}" > kubeconfig
          export KUBECONFIG=$PWD/kubeconfig
          kubectl rollout restart deployment cortex-worker