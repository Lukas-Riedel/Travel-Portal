name: Light Portal Deployment
on:
  workflow_dispatch:
    inputs:
      custom-timestamp:
        description: 'Enter maximum timestamp for the content (leave empty for the current timestamp):'
        required: false
        default: ''
jobs:
  deploy-portal:
    name: Deploy Portal
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set Lowercase Owner Name
      id: owner-lowercasing
      run: echo "owner=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
    - name: Login to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Set Up Node.js
      uses: actions/setup-node@v3
      with:
          node-version: '18'
    - name: Install NPM Dependencies
      run: |
        cd Portal
        npm install --legacy-peer-deps
    - name: Generate Core Swagger types
      run: |
        cd Portal
        node swagger.config.js
      env:
        CORE_BASE_URL: ${{ vars.CORE_BASE_URL }}
    - name: Build Portal Image
      run: |
        docker build -t ghcr.io/${{ steps.owner-lowercasing.outputs.owner }}/portal:${{ github.run_number }} -f Portal/Dockerfile .
    - name: Push Portal Image
      run: |
        docker push ghcr.io/${{ steps.owner-lowercasing.outputs.owner }}/portal:${{ github.run_number }}
    - name: Set Up Kubectl
      uses: azure/setup-kubectl@v3
    - name: Open SSH Tunnel
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -H ${{ vars.SSH_HOSTNAME }} >> ~/.ssh/known_hosts
        ssh -L 6443:localhost:6443 ${{ vars.SSH_USER }}@${{ vars.SSH_HOSTNAME }} -N -f
    - name: Set Up Helm
      uses: azure/setup-helm@v3
    - name: Deploy Portal with Helm
      run: |
        echo "${{ secrets.KUBECONFIG }}" | base64 -d > kubeconfig
        export KUBECONFIG=$PWD/kubeconfig
        USER_INPUT="${{ github.event.inputs.custom-timestamp }}"
        if [ -z "$USER_INPUT" ]; then
          FINAL_TIMESTAMP=$(date +%s)
        else
          FINAL_TIMESTAMP=$USER_INPUT
        fi
        helm upgrade portal-light ./Helm/Portal \
          -f ./Helm/Portal/values.yaml \
          --set portal.tag=${{ github.run_number }} \
          --set portal.service.host=travel-portal.eu \
          --set portal.credentials.default.username=light \
          --set portal.credentials.default.password=light \
          --set portal.url.base.public=https://travel-portal.eu \
          --set portal.content.range.max=$FINAL_TIMESTAMP \
          --install \
          --wait \
          --timeout 5m \
          --atomic