{{- if .Values.cortex.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-worker-scaler-secret
type: Opaque
stringData:
  rabbitmq-connection-string: "http://{{ .Values.cortex.rabbitmq.hostname }}.default.svc.cluster.local:{{ .Values.cortex.rabbitmq.port.management }}/{{ .Values.cortex.rabbitmq.vhost | trimPrefix "/" | urlquery }}"
{{- end }}