{{- if .Values.cortex.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
spec:
  replicas: {{ .Values.cortex.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: {{ max 0 (sub (int .Values.cortex.replicas) 1) }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
        version: "{{ .Values.cortex.tag }}"
        client: {{ .Values.cortex.grafana.client.name }}
        logging: "true"
    spec:
      nodeSelector:
        type: local
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: {{ .Release.Name }}
          resources:
            requests:
              cpu: 100m
              memory: 1.5Gi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          image: "{{ .Values.cortex.image }}:{{ .Values.cortex.tag }}"
          ports:
            - containerPort: {{ .Values.cortex.service.port }}
          readinessProbe:
            httpGet:
              path: /management/readiness
              port: {{ .Values.cortex.service.port }}
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /management/liveness
              port: {{ .Values.cortex.service.port }}
            periodSeconds: 60
            failureThreshold: 3
            timeoutSeconds: 5
          startupProbe:
            httpGet:
              path: /management/liveness
              port: {{ .Values.cortex.service.port }}
            periodSeconds: 10
            failureThreshold: 50
            timeoutSeconds: 5
          env:
            - name: VERSION_TAG
              value: "{{ .Values.cortex.tag }}"
            - name: APP_NAME
              value: "{{ .Release.Name }}"
            - name: WORKERS_COUNT
              value: "{{ .Values.cortex.workers }}"
            - name: EMBEDDINGS_MODEL_NAME
              value: "{{ .Values.cortex.model.embeddings }}"
            - name: ENGINE_DEVICE
              value: "{{ .Values.cortex.engine }}"
            - name: IAM_HOST
              value: "{{ .Values.cortex.iam.host }}"
            - name: IAM_PORT
              value: "{{ .Values.cortex.iam.port }}"
            - name: IAM_BACKEND_CLIENT_ID
              value: "{{ .Values.cortex.iam.client.backend.id }}"
            - name: IAM_BACKEND_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: iam-secret
                  key: backend-client-secret
            - name: CORE_HOST
              value: "{{ .Values.cortex.core.host }}"
            - name: CORE_PORT
              value: "{{ .Values.cortex.core.port }}"
            - name: GEMINI_MODELS
              value: "{{ join "," .Values.cortex.model.generative }}"
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: cortex-secret
                  key: google-gemini-api-key
          volumeMounts:
            - name: {{ .Release.Name }}-tmp
              mountPath: /tmp
            - name: {{ .Release.Name }}-home-appuser-cache-huggingface
              mountPath: /home/appuser/.cache/huggingface
      volumes:
        - name: {{ .Release.Name }}-tmp
          emptyDir: {}
        - name: {{ .Release.Name }}-home-appuser-cache-huggingface
          persistentVolumeClaim:
              claimName: {{ .Release.Name }}-pvc
{{- end }}
