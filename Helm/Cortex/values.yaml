cortex:
  enabled: true
  image: ghcr.io/lukas-riedel/cortex
  # tag: latest
  workers: 1
  threads: 2
  scaling:
    items: "5"
    cooldown: 300
    grace: 900
  model: clip-ViT-B-32
  # model: clip-ViT-L-14
  engine: cpu
  core:
    host: core
    port: 8080
  highlights:
    coefficient:
      content: "0.75"
      age: "0.1"
      negative: "0.3"
    threshold:
      similarity: "0.9"
  rabbitmq:
    hostname: rabbitmq
    port: 
      amqp: 5672
      management: 15672
    vhost: /
    username: admin
    heartbeat: "60"
    queue:
      cortex: CortexQueue
  redis:
    hostname: redis
    port: 6379
  iam:
    host: iam
    port: 8080
    client:
      backend:
        id: admin-cli
  grafana:
    entrypoint: https://logs-prod-012.grafana.net
    client:
      name: travel-portal-service
    username: "1287508"