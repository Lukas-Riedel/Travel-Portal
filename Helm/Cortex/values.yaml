cortex:
  enabled: true
  image: ghcr.io/lukas-riedel/cortex
  tag: latest
  replicas: 1
  workers: 1
  service:
    type: ClusterIP
    port: 8080
  embedding:
    model: clip-ViT-L-14
    engine: cpu
  llm:
    model:
      repo: "bartowski/Qwen2.5-1.5B-Instruct-GGUF"
      file: "Qwen2.5-1.5B-Instruct-Q4_K_M.gguf"
  iam:
    host: iam
    port: 8080
    client:
      app:
        id: travel-portal-app
      backend:
        id: admin-cli
  grafana:
    client:
      name: travel-portal-service