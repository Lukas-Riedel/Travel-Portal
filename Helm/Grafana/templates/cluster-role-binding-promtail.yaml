{{- if .Values.promtail.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-promtail-cluster-role-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-promtail-cluster-role
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-promtail-service-account
    namespace: default
{{- end }}