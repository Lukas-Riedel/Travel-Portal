{{- if .Values.promtail.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-promtail-configmap
data:
  promtail.yaml: |
    server:
      http_listen_port: 9080
    clients:
      - url: ${LOKI_URL}/loki/api/v1/push
        basic_auth:
          username: ${LOKI_USERNAME}
          password: ${LOKI_PASSWORD}
    positions:
      filename: /run/promtail/positions.yaml
    scrape_configs:
      - job_name: kubernetes-pods
        pipeline_stages:
          - cri: {}
          - json:
              expressions:
                level_name: level_name
          - labels:
              level_name:
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_logging]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_namespace]
            action: keep
            regex: default|kube-system|keda
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: service
          - source_labels: [__meta_kubernetes_pod_label_version]
            target_label: version_tag
          - source_labels: [__meta_kubernetes_pod_label_client]
            target_label: client_name
          - source_labels: [__meta_kubernetes_pod_uid, __meta_kubernetes_pod_container_name]
            separator: /
            replacement: /var/log/pods/*$1/*.log
            target_label: __path__
{{- end }}