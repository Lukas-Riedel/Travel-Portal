{{- if .Values.opensearch.dashboards.enabled }}
apiVersion: http.keda.sh/v1alpha1
kind: HTTPScaledObject
metadata:
  name: {{ .Release.Name }}-dashboards-scaler
spec:
  hosts:
    - {{ .Values.opensearch.dashboards.service.host }}
  scaleTargetRef:
    name: {{ .Release.Name }}-dashboards
    kind: Deployment
    apiVersion: apps/v1
    service: {{ .Release.Name }}-dashboards
    port: {{ .Values.opensearch.dashboards.service.port }}
  replicas:
    min: 0
    max: {{ .Values.opensearch.dashboards.replicas }}
  scaledownPeriod: 300
{{- end }}