{{- if .Values.opensearch.dashboards.enabled }}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ .Release.Name }}-dashboards-web-router
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`{{ .Values.opensearch.dashboards.service.host }}`)
      kind: Rule
      services:
        - name: {{ .Release.Name }}-dashboards
          port: {{ .Values.opensearch.dashboards.service.port }}
      middlewares:
        - name: {{ .Release.Name }}-dashboards-auth-middleware
  tls:
    certResolver: letsencrypt
{{- end }}
