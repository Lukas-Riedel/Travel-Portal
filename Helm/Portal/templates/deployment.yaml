{{- if .Values.portal.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
spec:
  replicas: {{ .Values.portal.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      containers:
        - name: {{ .Release.Name }}
          image: "{{ .Values.portal.image }}:{{ .Values.portal.tag }}" 
          ports:
            - containerPort: {{ .Values.portal.service.port }}    
          readinessProbe:
            httpGet:
              path: /management/readiness
              port: {{ .Values.portal.service.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 1
          livenessProbe:
            httpGet:
              path: /management/liveness
              port: {{ .Values.portal.service.port }}
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 1         
          volumeMounts:
            - name: {{ .Release.Name }}-config
              mountPath: /usr/share/nginx/html/env.js
              subPath: env.js
      volumes:
        - name: {{ .Release.Name }}-config
          configMap:
            name: {{ .Release.Name }}-configmap
{{- end }}