{{- if .Values.snappymail.enabled }}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: snappymail-web-router
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`{{ .Values.snappymail.service.host }}`)
      kind: Rule
      services:
        - name: keda-add-ons-http-interceptor-proxy
          namespace: keda
          port: 8080
  tls:
    certResolver: letsencrypt
{{- end }}
