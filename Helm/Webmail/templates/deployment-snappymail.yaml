{{- if .Values.snappymail.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: snappymail
  labels:
    app: snappymail
spec:
  replicas: 0
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: snappymail
  template:
    metadata:
      labels:
        app: snappymail
    spec:
      containers:
        - name: snappymail
          image: "{{ .Values.snappymail.image }}:{{ .Values.snappymail.tag }}"
          ports:
            - containerPort: {{ .Values.snappymail.service.port }}
          readinessProbe:
            httpGet:
              path: /index.php
              port: {{ .Values.snappymail.service.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 1
          livenessProbe:
            httpGet:
              path: /index.php
              port: {{ .Values.snappymail.service.port }}
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 1     
          volumeMounts:
            - name: snappymail-data
              mountPath: /var/lib/snappymail
      volumes:
        - name: snappymail-data
          persistentVolumeClaim:
            claimName: snappymail-pvc
{{- end }}
