{{- if .Values.pgadmin.enabled }}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ .Release.Name }}-pgadmin-web-router
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`{{ .Values.pgadmin.service.host }}`)
      kind: Rule
      services:
        - name: {{ .Release.Name }}-pgadmin
          port: {{ .Values.pgadmin.service.port }}
  tls:
    certResolver: letsencrypt
{{- end }}
