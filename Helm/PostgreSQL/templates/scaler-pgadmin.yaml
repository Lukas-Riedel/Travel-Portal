{{- if .Values.pgadmin.enabled }}
apiVersion: http.keda.sh/v1alpha1
kind: HTTPScaledObject
metadata:
  name: {{ .Release.Name }}-pgadmin-scaler
spec:
  hosts:
    - {{ .Values.pgadmin.service.host }}
  scaleTargetRef:
    name: {{ .Release.Name }}-pgadmin
    kind: Deployment
    apiVersion: apps/v1
    service: {{ .Release.Name }}-pgadmin
    port: {{ .Values.pgadmin.service.port }}
  replicas:
    min: 0
    max: {{ .Values.pgadmin.replicas }}
  scaledownPeriod: 300
{{- end }}