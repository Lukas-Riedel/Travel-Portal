{{- define "core.podWorker" -}}
terminationGracePeriodSeconds: {{ .Values.core.scaling.grace }}
securityContext:
  runAsNonRoot: true
  runAsUser: 33
  runAsGroup: 33
  fsGroup: 33
initContainers:
  - name: {{ .Release.Name }}-worker-cleanup
    image: busybox
    command: ["sh", "-c", "rm -f /tmp/timeout"]
    volumeMounts:
{{ include "core.volumeMounts" . | nindent 6 }}
containers:
  - name: {{ .Release.Name }}-worker
    resources:
      requests:
        cpu: 200m
        memory: 200Mi
    securityContext:
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
    image: "{{ .Values.core.image }}:{{ .Values.core.tag }}"
    command: ["/usr/bin/tini", "-g", "--"]
    args:
      - php
      - -d
      - max_execution_time=0
      - -d
      - memory_limit=400M
      - /var/www/html/src/worker.php
    readinessProbe:
      exec:
        command:
          - /bin/sh
          - -c
          - "test -f /tmp/timeout"
      initialDelaySeconds: 15
      periodSeconds: 15
      failureThreshold: 3
      timeoutSeconds: 5
    livenessProbe:
      exec:
        command:
          - /bin/sh
          - -c
          - "test $(date +%s) -lt $(cat /tmp/timeout)"
      initialDelaySeconds: 60
      periodSeconds: 30
      failureThreshold: 3
      timeoutSeconds: 5
    env:
{{ include "core.env" . | nindent 6 }}
    volumeMounts:
{{ include "core.volumeMounts" . | nindent 6 }}
volumes:
{{- include "core.volumes" . | nindent 2 }}
{{- end -}}