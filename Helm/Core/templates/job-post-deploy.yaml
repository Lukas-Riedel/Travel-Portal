{{- if .Values.core.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-post-deploy
  annotations:
    "helm.sh/hook": post-upgrade,post-install
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
        version: "{{ .Values.core.tag }}"
        client: {{ .Values.core.grafana.client.name }}
        logging: "true"
    spec:
      nodeSelector:
        type: cloud
      securityContext:
        runAsNonRoot: true
        runAsUser: 33
        runAsGroup: 33
        fsGroup: 33
      restartPolicy: Never
      containers:
        - name: {{ .Release.Name }}-post-deploy
          image: "{{ .Values.core.image }}:{{ .Values.core.tag }}"
          command: ["php", "-d", "max_execution_time=300", "-d", "memory_limit=300M", "/var/www/html/src/postdeploy.php"]
          env:
{{- include "core.env" . | nindent 12 }}
          volumeMounts:
{{- include "core.volumeMounts" . | nindent 12 }}
      volumes:
{{- include "core.volumes" . | nindent 8 }}
{{- end }}
