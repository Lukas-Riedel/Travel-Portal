{{- if .Values.core.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: core-worker-cronjob
spec:
  schedule: "*/1 * * * *"
  successfulJobsHistoryLimit: 0
  failedJobsHistoryLimit: 0
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: trigger
            image: curlimages/curl
            command: ["curl", "-X", "POST", "http://core:{{ .Values.core.service.port }}/worker.php"]
          restartPolicy: OnFailure
{{- end }}
