{{- if .Values.core.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-scheduler-cronjob
spec:
  schedule: "*/1 * * * *"
  successfulJobsHistoryLimit: 0
  failedJobsHistoryLimit: 0
  concurrencyPolicy: Allow
  jobTemplate:
    spec:
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app: {{ .Release.Name }}
            version: "{{ .Values.core.tag }}"
            client: {{ .Values.core.grafana.client.name }}
            logging: "true"
        spec:
          restartPolicy: Never
          containers:
          - name: {{ .Release.Name }}-scheduler
            resources:
              requests:
                cpu: 100m
                memory: 200Mi
              limits:
                cpu: 1000m
                memory: 400Mi
            image: "{{ .Values.core.image }}:{{ .Values.core.tag }}"
            command: ["php", "-d", "max_execution_time=60", "-d", "memory_limit=300M", "/var/www/html/src/scheduler.php"]
            env:
{{ include "core.env" . | nindent 14 }}
            volumeMounts:
{{ include "core.volumeMounts" . | nindent 14 }}
          volumes:
{{ include "core.volumes" . | nindent 12 }}
{{- end }}
