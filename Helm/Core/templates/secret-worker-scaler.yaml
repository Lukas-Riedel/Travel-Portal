{{- if .Values.core.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-worker-scaler-secret
type: Opaque
stringData:
  rabbitmq-connection-string: "http://{{ .Values.core.rabbitmq.internal.hostname }}.default.svc.cluster.local:{{ .Values.core.rabbitmq.internal.port.management }}/{{ .Values.core.rabbitmq.vhost | trimPrefix "/" | urlquery }}"
{{- end }}