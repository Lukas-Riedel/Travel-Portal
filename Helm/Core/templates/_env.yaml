- name: MAIN_HIGHLIGHT_QUALITY_MULTIPLIER
  value: "{{ .Values.core.place.quality.multiplier.highlight.main }}"
- name: STATISTICS_VALUES_COUNT_LIMIT
  value: "{{ .Values.core.statistics.values.limit }}"
- name: ALBUM_THUMBNAIL_BUCKET
  value: "{{ .Values.core.bucket.album.thumbnail }}"
- name: HIGHLIGHT_PHOTO_BUCKET
  value: "{{ .Values.core.bucket.highlight.full }}"
- name: HIGHLIGHT_THUMBNAIL_BUCKET
  value: "{{ .Values.core.bucket.highlight.thumbnail }}"
- name: PHOTO_THUMBNAIL_WIDTH
  value: "{{ .Values.core.photo.thumbnail.width }}"
- name: PHOTO_THUMBNAIL_HEIGHT
