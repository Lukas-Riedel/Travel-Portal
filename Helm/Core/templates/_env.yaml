- name: CLUSTERS_COUNT_COEFFICIENT
  value: "{{ .Values.core.highlight.selecting.cluster.coefficient }}"
- name: STYLE_EMBEDDING_COEFFICIENT
  value: "{{ .Values.core.highlight.selecting.embedding.style.coefficient }}"
- name: NEGATIVE_EMBEDDING_COEFFICIENT
  value: "{{ .Values.core.highlight.selecting.embedding.negative.coefficient }}"
