{{- define "core.env" }}
- name: VERSION_TAG
  value: "{{ .Values.core.tag }}"
- name: APP_NAME
  value: "{{ .Release.Name }}"
- name: ENCRYPTION_PRIVATE_KEY
  valueFrom:
    secretKeyRef:
      name: {{ .Release.Name }}-secret
      key: encryption-key
- name: CORE_BASE_URL
  value: "{{ .Values.core.url.base }}"
- name: S3_BASE_URL
  value: "{{ .Values.core.url.s3.base }}"
- name: IBM_DATAPLATFORM_BASE_URL
  value: "{{ .Values.core.url.ibm.dataplatform.base }}"
- name: DB_HOST
  value: "{{ .Values.core.db.hostname }}"            
- name: DB_PORT
  value: "{{ .Values.core.db.port }}"  
- name: DB_NAME
  value: "{{ .Values.core.db.database }}"  
- name: DB_USER
  valueFrom:
    secretKeyRef:
      name: postgres-secret
      key: postgres-username
- name: DB_PASSWORD
  valueFrom:
    secretKeyRef:
      name: postgres-secret
      key: postgres-password
- name: REDIS_HOST
  value: "{{ .Values.core.redis.hostname }}"            
- name: REDIS_PORT
  value: "{{ .Values.core.redis.port }}"  
- name: REDIS_PASSWORD
  valueFrom:
    secretKeyRef:
      name: redis-secret
      key: redis-password
