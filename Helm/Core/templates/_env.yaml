  value: "{{ .Values.core.s3.region }}"
- name: S3_HOST
  value: "{{ .Values.core.s3.host }}"
- name: S3_PORT
  value: "{{ .Values.core.s3.port }}"
- name: S3_ACCESS_KEY
  valueFrom:
    secretKeyRef:
      name: minio-secret
      key: minio-access-key
- name: S3_SECRET_KEY
  valueFrom:
    secretKeyRef:
      name: minio-secret
      key: minio-password
- name: BACKEND_GOOGLE_MAPS_API_KEY
  valueFrom:
    secretKeyRef:
      name: {{ .Release.Name }}-secret
      key: google-maps-api-key
- name: GOOGLE_GEMINI_API_KEY
  valueFrom:
    secretKeyRef:
      name: {{ .Release.Name }}-secret
      key: google-gemini-api-key
