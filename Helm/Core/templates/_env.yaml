- name: FLARESOLVERR_PORT
  value: "{{ .Values.core.flaresolverr.port }}"
- name: LIBRE_TRANSLATE_HOST
  value: "{{ .Values.core.libretranslate.hostname }}"            
- name: LIBRE_TRANSLATE_PORT
  value: "{{ .Values.core.libretranslate.port }}"
- name: RMQ_INTERNAL_HOST
  value: "{{ .Values.core.rabbitmq.internal.hostname }}"            
- name: RMQ_INTERNAL_PORT
  value: "{{ .Values.core.rabbitmq.internal.port.amqp }}"  
- name: RMQ_EXTERNAL_HOST
  value: "{{ .Values.core.rabbitmq.external.hostname }}"            
- name: RMQ_EXTERNAL_PORT
  value: "{{ .Values.core.rabbitmq.external.port.amqp }}"  
