- name: PHOTO_EMBEDDING_HEIGHT
  value: "{{ .Values.core.photo.embedding.height }}"
- name: PHOTO_FULL_WIDTH
  value: "{{ .Values.core.photo.full.width }}"
- name: PHOTO_FULL_HEIGHT
  value: "{{ .Values.core.photo.full.height }}"
- name: INDOOR_PHOTO_ISO_THRESHOLD
  value: "{{ .Values.core.photo.indoor.threshold.iso }}"
- name: ACTUAL_WEATHER_FORECAST_DAYS_TO_CACHE
