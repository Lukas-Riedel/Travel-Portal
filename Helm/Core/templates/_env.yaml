  value: "{{ .Values.core.fitness.overwrite.threshold.duration }}"
- name: ALLOW_FITNESS_OVERWRITE_THRESHOLD_STEPS
  value: "{{ .Values.core.fitness.overwrite.threshold.step }}"
- name: UPDATE_FITNESS_THRESHOLD_DAYS
  value: "{{ .Values.core.fitness.update.threshold.days }}"
