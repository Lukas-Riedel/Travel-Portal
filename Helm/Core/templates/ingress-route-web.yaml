{{- if .Values.core.enabled }}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: core-web-router
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`{{ .Values.core.host }}`)
      kind: Rule
      services:
        - name: core
          port: {{ .Values.core.service.port }}
  tls:
    certResolver: letsencrypt
{{- end }}