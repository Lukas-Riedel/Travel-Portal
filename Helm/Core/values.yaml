core:
  enabled: true
  image: ghcr.io/lukas-riedel/core
  # tag: latest
  replicas: 1
  workers: 5
  scaling:
    items: "100"
    cooldown: 120
    grace: 60
  service:
    type: ClusterIP
    port: 8080
    host: api.lriedel.cz
  url:
    base:
      public: https://api.lriedel.cz
    iam:
      base:
        public: https://iam.lriedel.cz
    s3:
      base:
        public: https://s3.lriedel.cz
    ibm:
      dataplatform:
        base:
          public: https://api.eu-de.dataplatform.cloud.ibm.com
  db:
    hostname: postgres
    port: 5432
    database: core
    username: admin
  redis:
    hostname: redis
    port: 6379
  rabbitmq:
    internal:
      hostname: rabbitmq
      port: 5672
    external:
      hostname: rmq.lriedel.cz
      port: 5671
    vhost: /
    username: admin
    heartbeat: "60"
    queue:
      worker: WorkerQueue
  fcm:
    project:
      id: travel-blog-free
  s3:
    region: eu-central-1
    host: minio
    port: 9000
    accesskey: admin
  iam:
    client:
      app:
        id: travel-portal-app
      backend:
        id: admin-cli
      agent:
        id: travel-portal-agent
    jwks:
      key:
        public: -----BEGIN PUBLIC KEY-----\\n-----END PUBLIC KEY-----\n
  grafana:
    entrypoint: https://logs-prod-012.grafana.net
    client:
      name: travel-portal-service
    username: "1287508"
  origins:
    whitelist: https://travel-portal.eu,https://lriedel.cz