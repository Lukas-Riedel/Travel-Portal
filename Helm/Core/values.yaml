core:
  enabled: true
  image: ghcr.io/lukas-riedel/core
  # tag: latest
  replicas: 1
  workers: 5
  service:
    type: ClusterIP
    port: 8080
  url:
    base:
      public: https://api.lriedel.fun
    iam:
      base:
        public: https://iam.lriedel.fun
    ibm:
      dataplatform:
        base:
          public: https://api.eu-de.dataplatform.cloud.ibm.com
  db:
    hostname: postgres
    port: 5432
    database: core
    username: admin
  redis:
    hostname: redis
    port: 6379
  rabbitmq:
    internal:
      hostname: rabbitmq
      port: 5672
    external:
      hostname: rmq.lriedel.fun
      port: 5671
    vhost: /
    username: admin
    queue:
      worker: WorkerQueue
  fcm:
    project:
      id: travel-blog-free
  iam:
    client:
      app:
        id: travel-portal-app
      backend:
        id: admin-cli
      agent:
        id: travel-portal-agent
    jwks:
      key:
        public: -----BEGIN PUBLIC KEY-----\\n-----END PUBLIC KEY-----\n
  grafana:
    entrypoint: https://logs-prod-012.grafana.net
    client:
      name: travel-portal-service
    username: "1287508"
  origins:
    whitelist: https://travel-portal.eu,https://lriedel.cz