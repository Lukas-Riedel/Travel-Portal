{{- if .Values.redisinsight.enabled }}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: redisinsight-web-router
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`{{ .Values.redisinsight.host }}`)
      kind: Rule
      services:
        - name: {{ .Values.redisinsight.service.name }}
          port: {{ .Values.redisinsight.service.port }}
      middlewares:
        - name: redisinsight-auth-middleware
          namespace: default
  tls:
    certResolver: letsencrypt
{{- end }}
