apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: redisinsight-web-router
spec:
  entryPoints:
    - web
  routes:
    - match: PathPrefix(`/redis`)
      kind: Rule
      services:
        - name: redisinsight
          port: 5540
      middlewares:
        - name: redisinsight-auth-middleware
          namespace: default