apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portal-ingress-admin
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: default-auth-middleware@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /redis
            pathType: ImplementationSpecific
            backend:
              service:
                name: redisinsight
                port:
                  number: 5540