{{- if .Values.rabbitmq.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  labels:
    app: rabbitmq
spec:
  replicas: {{ .Values.rabbitmq.replicas }}
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: "{{ .Values.rabbitmq.image }}:{{ .Values.rabbitmq.tag }}"
          ports:
            - name: amqp
              containerPort: {{ .Values.rabbitmq.service.broker.port }}
            - name: http-management
              containerPort: {{ .Values.rabbitmq.service.management.port }}
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-username
                  key: rabbitmq-username
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-password
                  key: rabbitmq-password 
          volumeMounts:
            - name: rabbitmq-data
              mountPath: /rabbitmq      
            - name: rabbitmq-config
              mountPath: /etc/rabbitmq/rabbitmq.conf 
              subPath: rabbitmq.conf
      volumes:
        - name: rabbitmq-data
          persistentVolumeClaim:
            claimName: shared
        - name: rabbitmq-config
          configMap:
            name: rabbitmq-configmap
{{- end }}