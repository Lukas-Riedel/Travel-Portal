{{- if .Values.rediscommander.enabled }}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: rediscommander-web-router
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`{{ .Values.rediscommander.service.host }}`)
      kind: Rule
      services:
        - name: keda-add-ons-http-interceptor-proxy
          namespace: keda
          port: 8080
      middlewares:
        - name: rediscommander-auth-middleware
  tls:
    certResolver: letsencrypt
{{- end }}
