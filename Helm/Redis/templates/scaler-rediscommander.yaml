{{- if .Values.rediscommander.enabled }}
apiVersion: http.keda.sh/v1alpha1
kind: HTTPScaledObject
metadata:
  name: {{ .Release.Name }}-rediscommander-scaler
spec:
  hosts:
    - {{ .Values.rediscommander.service.host }}
  scaleTargetRef:
    name: {{ .Release.Name }}-rediscommander
    kind: Deployment
    apiVersion: apps/v1
    service: {{ .Release.Name }}-rediscommander
    port: {{ .Values.rediscommander.service.port }}
  replicas:
    min: 0
    max: {{ .Values.rediscommander.replicas }}
  scaledownPeriod: 300
{{- end }}