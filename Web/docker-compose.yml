version: '3.8'
services:
  php-app:
    build: .
    ports:
      - "8080:80"
    environment:
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: admin
      DB_NAME: test_database
    depends_on:
      - mysql
    command: ["sh", "-c", "wait-for-it mysql:3306 -- mkdir -p /var/www/html/php/config && echo '<?php\ndefine(\"DB_NAME\", getenv(\"DB_NAME\"));\ndefine(\"DB_USER\", getenv(\"DB_USER\"));\ndefine(\"DB_PASSWORD\", getenv(\"DB_PASSWORD\"));\ndefine(\"DB_HOST\", getenv(\"DB_HOST\"));\n?>' > /var/www/html/php/config/db.php && php /var/www/html/php/deploy.php && apache2-foreground"]
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: admin
      MYSQL_DATABASE: test_database
    volumes:
      - mysql_data:/var/lib/mysql
volumes:
  mysql_data: