worker_processes 1;

events { 
    worker_connections 1024; 
}

http {
    include              mime.types;
    default_type         application/octet-stream;
    sendfile             on;
    client_max_body_size 20M;

    proxy_cache_path /var/tmp/cache/nginx levels=1:2 keys_zone=nginx_cache:8m max_size=1G inactive=1h use_temp_path=off;

    server {
        listen 8080;
        server_name _;
        access_log off; 
        error_log /dev/stderr warn;

        root /var/www/html/public;

        index index.php;

        location = /swagger {
            try_files /swagger/index.html =404;
        }

        location / {
            try_files $uri /index.php$is_args$args;
        }

        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_index index.php;
        }

        location /proxy/googleusercontent/ {
            # TODO: Allow access only from origins specified in the ALLOWED_REQUEST_ORIGINS environment variable.
            add_header 'Access-Control-Allow-Origin' "$http_origin" always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
            add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;

            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' "$http_origin" always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain; charset=utf-8';
                add_header 'Content-Length' 0;
                return 204;
            }

            proxy_pass https://lh3.googleusercontent.com/;
            proxy_set_header Host lh3.googleusercontent.com;
            
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_ignore_headers Cache-Control Expires Set-Cookie;
            proxy_cache nginx_cache;
            proxy_cache_valid 200 1h;
        }
    }
}
